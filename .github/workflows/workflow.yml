name: Python Project Template Build
run-name: ${{ github.event_name }} - ${{ github.ref_name }}
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feature/*
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        uses: docker://python:3.12.0
      - run: apt install pipx
      - run: pipx install cookiecutter
